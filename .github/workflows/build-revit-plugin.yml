name: Build Revit Plugin

on:
  push:
    paths:
      - "revit-plugin/**"
      - ".github/workflows/build-revit-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build plugin (Release)
        run: dotnet build revit-plugin/CableTrayHub.Revit/CableTrayHub.Revit.csproj -c Release

      - name: Susun paket siap-install
        shell: pwsh
        run: |
          $out = "package/CableTrayHub-Revit2025"
          New-Item -ItemType Directory -Force "$out/CableTrayHub" | Out-Null
          Copy-Item revit-plugin/CableTrayHub.addin $out
          Copy-Item revit-plugin/CableTrayHub.Revit/bin/Release/CableTrayHub.Revit.dll "$out/CableTrayHub"
          Copy-Item revit-plugin/README.md $out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CableTrayHub-Revit2025
          path: package/
          if-no-files-found: error

      - name: Zip paket untuk release
        shell: pwsh
        run: Compress-Archive -Path package/CableTrayHub-Revit2025 -DestinationPath CableTrayHub-Revit2025.zip -Force

      - name: Publish release "latest" (link unduh publik)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Plugin Revit 2025 — build terbaru"
          body: |
            Build otomatis dari commit ${{ github.sha }}.
            Ekstrak zip lalu salin isinya ke: %APPDATA%\Autodesk\Revit\Addins\2025\
          files: CableTrayHub-Revit2025.zip
